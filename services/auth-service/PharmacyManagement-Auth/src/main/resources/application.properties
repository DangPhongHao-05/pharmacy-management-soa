spring.config.import=optional:file:./.env[.properties]

spring.application.name=PharmacyManagement-Auth

# SPRING - DATASOURCE
spring.datasource.url=${SOA_PHARMACY_MANAGEMENT_AUTH_SUPABASE_URL}
spring.datasource.username=${SOA_PHARMACY_MANAGEMENT_AUTH_SUPABASE_USERNAME}
spring.datasource.password=${SOA_PHARMACY_MANAGEMENT_AUTH_SUPABASE_PASSWORD}

# SPRING - JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# SERVER
server.address=0.0.0.0
server.port=8080

# JWT
jwt.signer-key=${SOA_PHARMACY_MANAGEMENT_AUTH_JWT_SIGNER_KEY}